[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cora-infans"
version = "0.1.0"
description = "Infant-inspired auditory and cognitive architecture research scaffold"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2,<3",
]

[project.scripts]
cora-infans = "cora_infans.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
