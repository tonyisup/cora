[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cora-infans"
version = "0.1.0"
description = "Bounded local auditory processing and exact-efference validation system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2,<3",
    "pydantic>=2,<3",
    "pyusb>=1,<2",
    "pyyaml>=6,<7",
    "libusb-package>=1,<2",
    "sounddevice>=0.5,<1",
]

[project.scripts]
cora-infans = "cora_infans.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
cora_infans = ["operational_contract.json"]
