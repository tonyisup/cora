name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Operational contract and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test runner
        run: python -m pip install --upgrade pip pytest -e .

      - name: Verify bounded operational evidence
        run: python -m cora_infans --operational-readiness

      - name: Run hardware-safe test suite
        run: python -m pytest tests -q
