name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Operational contract and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.13.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.14"
          cache: pip

      - name: Install package and test runner
        run: >-
          python -m pip install
          --constraint requirements-ci.txt
          --editable .
          pytest==9.1.1

      - name: Verify bounded operational evidence
        run: python -m cora_infans --operational-readiness

      - name: Run hardware-safe test suite
        run: python -m pytest tests -q
